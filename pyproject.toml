[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomass-heat-electrolysis-dispatch"
version = "0.1.0"
description = "Price-dependent electrolysis and H2/O2 storage dispatch for biomass process-heat chains on real DE-LU day-ahead prices."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DataWithSyed" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scipy>=1.11",
  "biomass-heat-plant-model @ git+https://github.com/DataWithSyed/biomass-heat-plant-model.git",
]
keywords = ["biomass", "electrolysis", "dispatch", "day-ahead", "process heat", "H2 storage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/DataWithSyed/biomass-heat-electrolysis-dispatch"
Project = "https://github.com/DataWithSyed/biomass-process-heat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
